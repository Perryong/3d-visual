<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TPZ-77 BASILISK — General arrangement · 3D component disassembly</title>
    <meta
      name="description"
      content="An interactive general arrangement drawing sheet: rotate the vehicle, take it apart with the disassembly slider, and read the annotated bill of materials."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Saira+Condensed:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/sheet.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <div class="sheet">
      <!-- ── Sheet header ─────────────────────────────────────────────── -->
      <header class="sheet__head">
        <div class="ident">
          <h1 id="sheet-designation" class="ident__designation">TPZ-77 «BASILISK»</h1>
          <p id="sheet-type" class="ident__type">MAIN BATTLE TANK</p>
          <p id="sheet-subtitle" class="ident__sub">
            General arrangement · Component disassembly &amp; annotation
          </p>
        </div>

        <dl class="titleblock">
          <div><dt>Doc no</dt><dd id="tb-doc">—</dd></div>
          <div><dt>Rev</dt><dd id="tb-rev">—</dd></div>
          <div><dt>Scale</dt><dd id="tb-scale">—</dd></div>
          <div><dt>Sheet</dt><dd id="tb-sheet">—</dd></div>
        </dl>

        <div class="mobile-tabs">
          <button type="button" data-panel-toggle="bom" aria-expanded="false">Parts list</button>
          <button type="button" data-panel-toggle="data" aria-expanded="false">Component data</button>
        </div>
      </header>

      <!-- ── Body ─────────────────────────────────────────────────────── -->
      <main class="sheet__body">
        <!-- Parts list -->
        <aside id="bom" class="panel panel--bom">
          <div class="panel__head">
            <h2>Parts list</h2>
            <span id="bom-count" class="panel__meta"></span>
          </div>
          <ol id="bom-list" class="bom"></ol>
        </aside>

        <!-- 3D field -->
        <section class="field">
          <canvas id="field" aria-label="Three-dimensional view of the vehicle"></canvas>
          <svg id="leader-layer" class="leaders" aria-hidden="true"></svg>
          <div id="callout-layer" class="callouts"></div>

          <div class="scalebar" aria-hidden="true">
            <span class="scalebar__rule"></span>
            <span class="scalebar__label">2 m</span>
          </div>

          <p class="hint">
            Drag to rotate · scroll to zoom · right-drag to pan · click a component for data · Esc to
            deselect
          </p>
        </section>

        <!-- Component data -->
        <aside id="data" class="panel panel--data">
          <div class="panel__head">
            <h2>Component data</h2>
            <span class="panel__meta" id="tb-status">—</span>
          </div>
          <div id="data-panel" class="data"></div>
          <div class="panel__actions">
            <button type="button" id="btn-focus" data-needs-selection>Focus</button>
            <button type="button" id="btn-isolate" data-needs-selection>Isolate</button>
            <button type="button" id="btn-clear">Show all</button>
          </div>
        </aside>
      </main>

      <!-- ── Controls ─────────────────────────────────────────────────── -->
      <footer class="sheet__foot">
        <div class="control control--slider">
          <label for="disassembly">Disassembly</label>
          <input id="disassembly" type="range" min="0" max="100" step="1" value="0" />
          <output id="disassembly-readout" for="disassembly">0 %</output>
        </div>

        <div class="control control--presets">
          <button type="button" data-preset="0">Assembled</button>
          <button type="button" data-preset="35">Service</button>
          <button type="button" data-preset="100">Full</button>
        </div>

        <div class="control control--toggles">
          <label class="switch">
            <input type="checkbox" id="toggle-blueprint" />
            <span>Blueprint</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="toggle-callouts" checked />
            <span>Callouts</span>
          </label>
          <label class="switch">
            <input type="checkbox" id="toggle-rotate" />
            <span>Auto-rotate</span>
          </label>
          <button type="button" id="btn-reset" class="reset">Reset view</button>
        </div>
      </footer>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
